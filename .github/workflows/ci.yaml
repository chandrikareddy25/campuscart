name: CampusCart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verification_mode:
        description: Release verification mode (health is for comparison experiments)
        type: choice
        options: [transactional, health]
        default: transactional

concurrency:
  group: campuscart-main-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Backend validation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test release guard
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build backend test image
        run: docker build -t campuscart-test ./backend

      - name: Run validation tests
        run: |
          docker run --rm campuscart-test \
            python -m unittest discover -s app -p 'test_*.py' -v

  build:
    name: Build and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Set image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/campuscart-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            "./${{ matrix.service }}"

      - name: Sign in to container registry
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE}:${GITHUB_SHA}"

  capture-baseline:
    name: Verify current release and capture business data
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, campuscart]
    timeout-minutes: 5
    outputs:
      baseline: ${{ steps.preflight.outputs.baseline }}
    steps:
      - uses: actions/checkout@v6
      - name: Check baseline
        id: preflight
        env:
          RELEASE_TEST_PASSWORD: ${{ secrets.RELEASE_TEST_PASSWORD }}
        run: |
          baseline=$(python3 scripts/release_guard.py --preflight)
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

  update-deployment:
    name: Update Kubernetes image versions
    outputs:
      deployment_commit: ${{ steps.deploy.outputs.deployment_commit }}
    needs: [build, capture-baseline]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update image tags and push
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists. Skipping this deployment update."
            exit 0
          fi

          git reset --hard origin/main

          python3 scripts/update_release.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/application.yaml
          if git diff --cached --quiet; then
            echo "Image versions are already current."
            exit 0
          fi

          git commit -m "Deploy CampusCart images ${GITHUB_SHA}"
          git push origin HEAD:main
          echo "deployment_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-release:
    name: Verify release and restore on failure
    needs: [update-deployment, capture-baseline]
    if: needs.update-deployment.outputs.deployment_commit != ''
    runs-on: [self-hosted, Linux, X64, campuscart]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.update-deployment.outputs.deployment_commit }}
          fetch-depth: 0
      - name: Verify candidate release
        env:
          RELEASE_BASELINE: ${{ needs.capture-baseline.outputs.baseline }}
          RELEASE_TEST_PASSWORD: ${{ secrets.RELEASE_TEST_PASSWORD }}
        run: |
          python3 scripts/release_guard.py \
            --revision '${{ needs.update-deployment.outputs.deployment_commit }}' \
            --mode '${{ inputs.verification_mode || 'transactional' }}'
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}
          path: release-results/report.json
          if-no-files-found: warn
