name: CampusCart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Backend validation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build backend test image
        run: docker build -t campuscart-test ./backend

      - name: Run validation tests
        run: |
          docker run --rm campuscart-test \
            python -m unittest discover -s app -p 'test_*.py' -v

  build:
    name: Build and publish images
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Set image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=ghcr.io/${owner}/campuscart-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            "./${{ matrix.service }}"

      - name: Sign in to container registry
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE}:${GITHUB_SHA}"

  update-deployment:
    name: Update Kubernetes image versions
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Update image tags and push
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit exists. Skipping this deployment update."
            exit 0
          fi

          git reset --hard origin/main

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("k8s/application.yaml")
          text = path.read_text()
          owner = os.environ["GITHUB_REPOSITORY_OWNER"].lower()
          sha = os.environ["GITHUB_SHA"]

          for service in ("backend", "frontend"):
              pattern = (
                  rf"(?m)^(\s*image:\s*)"
                  rf"(?:ghcr\.io/[^/\s]+/)?campuscart-{service}:[^\s]+"
              )
              replacement = rf"\g<1>ghcr.io/{owner}/campuscart-{service}:{sha}"
              text, count = re.subn(pattern, replacement, text)
              if count != 1:
                  raise SystemExit(f"Expected one {service} image line, found {count}")

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/application.yaml
          if git diff --cached --quiet; then
            echo "Image versions are already current."
            exit 0
          fi

          git commit -m "Deploy CampusCart images ${GITHUB_SHA}"
          git push origin HEAD:main