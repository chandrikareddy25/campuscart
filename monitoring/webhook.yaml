apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-webhook-code
  namespace: monitoring
data:
  server.py: |
    import json
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/health":
                self.send_error(404)
                return
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def do_POST(self):
            if self.path != "/alerts":
                self.send_error(404)
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                if length <= 0 or length > 1048576:
                    self.send_error(400)
                    return
                payload = json.loads(self.rfile.read(length))
                print(json.dumps({
                    "received_at": datetime.now(timezone.utc).isoformat(),
                    "notification": payload
                }), flush=True)
            except (ValueError, TypeError):
                self.send_error(400)
                return
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"received")

        def log_message(self, *args):
            pass

    print("Alert receiver listening on port 8080", flush=True)
    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-webhook
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-webhook
  template:
    metadata:
      labels:
        app: alert-webhook
    spec:
      containers:
        - name: receiver
          image: python:3.12-slim
          command: ["python", "-u", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
      volumes:
        - name: code
          configMap:
            name: alert-webhook-code
---
apiVersion: v1
kind: Service
metadata:
  name: alert-webhook
  namespace: monitoring
spec:
  selector:
    app: alert-webhook
  ports:
    - port: 8080
      targetPort: 8080