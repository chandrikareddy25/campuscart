apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: campuscart-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - campuscart
  selector:
    matchLabels:
      app: backend
  podMetricsEndpoints:
    - targetPort: 8000
      path: /metrics
      interval: 15s